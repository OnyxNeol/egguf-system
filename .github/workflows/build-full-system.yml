name: Build EGGUF — Full System (All Platforms)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: egguf.exe
            archive: egguf-windows.zip
          - os: macos-latest
            platform: macos
            artifact: egguf
            archive: egguf-macos.zip
          - os: ubuntu-latest
            platform: linux
            artifact: egguf
            archive: egguf-linux.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller (Linux tkinter)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk tk-dev
          pip install pyinstaller

      - name: Install PyInstaller (macOS/Windows)
        if: matrix.platform != 'linux'
        run: pip install pyinstaller

      - name: Build egguf executable
        run: python build_full.py

      - name: Test the executable (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          chmod +x dist/egguf
          python3 -c "
          import struct
          with open('test.gguf', 'wb') as f:
              f.write(b'GGUF'); f.write(struct.pack('<I', 3)); f.write(struct.pack('<Q', 2)); f.write(struct.pack('<Q', 3))
              f.write(struct.pack('<Q', 19)); f.write(b'general.architecture'); f.write(struct.pack('<I', 8)); f.write(struct.pack('<Q', 5)); f.write(b'llama')
              f.write(struct.pack('<Q', 12)); f.write(b'general.name'); f.write(struct.pack('<I', 8)); f.write(struct.pack('<Q', 4)); f.write(b'Test')
              f.write(struct.pack('<Q', 17)); f.write(b'general.file_type'); f.write(struct.pack('<I', 4)); f.write(struct.pack('<I', 7))
              f.write(b'\x00' * 100)
          "
          ./dist/egguf convert test.gguf test.egguf
          test -f test.egguf && echo "OK: conversion works"
          ./dist/egguf info test.egguf | head -5

      - name: Test the executable (Windows)
        if: matrix.platform == 'windows'
        run: |
          python -c "
          import struct
          with open('test.gguf', 'wb') as f:
              f.write(b'GGUF'); f.write(struct.pack('<I', 3)); f.write(struct.pack('<Q', 2)); f.write(struct.pack('<Q', 3))
              f.write(struct.pack('<Q', 19)); f.write(b'general.architecture'); f.write(struct.pack('<I', 8)); f.write(struct.pack('<Q', 5)); f.write(b'llama')
              f.write(struct.pack('<Q', 12)); f.write(b'general.name'); f.write(struct.pack('<I', 8)); f.write(struct.pack('<Q', 4)); f.write(b'Test')
              f.write(struct.pack('<Q', 17)); f.write(b'general.file_type'); f.write(struct.pack('<I', 4)); f.write(struct.pack('<I', 7))
              f.write(b'\x00' * 100)
          "
          .\dist\egguf.exe convert test.gguf test.egguf
          if (Test-Path test.egguf) { echo "OK: conversion works" }

      - name: Package with installers
        run: |
          mkdir -p package/bin package/deploy
          cp dist/${{ matrix.artifact }} package/bin/
          cp -r deploy/* package/deploy/ 2>/dev/null || true
          cp -r sample_extensions package/ 2>/dev/null || true
          cp README.md package/ 2>/dev/null || true

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            package/bin/${{ matrix.artifact }}
          draft: true
          generate_release_notes: true
