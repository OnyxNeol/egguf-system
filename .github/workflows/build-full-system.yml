name: Build Full EGGUF System

on:
  workflow_dispatch:
    inputs:
      include_samples:
        description: 'Include sample EFE files in the package'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: egguf-system-linux
          - os: windows-latest
            artifact_name: egguf-system-windows
          - os: macos-latest
            artifact_name: egguf-system-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tkinter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build converter executable
        shell: bash
        run: |
          python -m PyInstaller --onefile \
            --name gguf2egguf \
            --noconfirm \
            --clean \
            --console \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --add-data "egguf_format.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "efe_format.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "scanner.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "egguf_ext.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "extensions.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "converter.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "gui.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "efe_creator.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "publish_registry.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            gguf2egguf.py

      - name: Build main EGGUF executable
        shell: bash
        run: |
          python -m PyInstaller --onefile \
            --name egguf \
            --noconfirm \
            --clean \
            --console \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.scrolledtext \
            --add-data "egguf_format.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "efe_format.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "scanner.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "egguf_ext.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "extensions.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "converter.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "gui.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "efe_creator.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "publish_registry.py${{ runner.os == 'Windows' && ';' || ':' }}." \
            main.py

      - name: Verify executables
        shell: bash
        run: |
          echo "=== Converter ==="
          if [ "${{ runner.os }}" = "Windows" ]; then
            ls -la dist/gguf2egguf.exe
            ls -la dist/egguf.exe
          else
            ls -la dist/gguf2egguf
            ls -la dist/egguf
            chmod +x dist/gguf2egguf dist/egguf
          fi

      - name: Test converter executable
        shell: bash
        run: |
          python -c "
          import struct
          with open('test.gguf', 'wb') as f:
              f.write(b'GGUF'); f.write(struct.pack('<I', 3)); f.write(struct.pack('<Q', 2)); f.write(struct.pack('<Q', 3))
              f.write(struct.pack('<Q', 19)); f.write(b'general.architecture'); f.write(struct.pack('<I', 8)); f.write(struct.pack('<Q', 5)); f.write(b'llama')
              f.write(struct.pack('<Q', 12)); f.write(b'general.name'); f.write(struct.pack('<I', 8)); f.write(struct.pack('<Q', 10)); f.write(b'CI Test')
              f.write(struct.pack('<Q', 17)); f.write(b'general.file_type'); f.write(struct.pack('<I', 4)); f.write(struct.pack('<I', 7))
              f.write(b'\x00' * 256)
          "
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/gguf2egguf.exe test.gguf
          else
            ./dist/gguf2egguf test.gguf
          fi
          test -f test.egguf && echo "[OK] Converter works"

      - name: Test scanner
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/egguf.exe scan sample_extensions/creative_writer.efe
          else
            ./dist/egguf scan sample_extensions/creative_writer.efe
          fi

      - name: Create package zip
        shell: bash
        run: |
          mkdir -p package/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/gguf2egguf.exe package/bin/
            cp dist/egguf.exe package/bin/
          else
            cp dist/gguf2egguf package/bin/
            cp dist/egguf package/bin/
          fi
          cp publish_registry.py package/
          cp install.py package/
          cp requirements.txt package/
          cp README.md package/

          # Include sample EFE files
          if [ -d sample_extensions ]; then
            cp -r sample_extensions package/
          fi

          # Include registry publisher
          python publish_registry.py --dry-run 2>/dev/null || true

          # Zip it
          cd package
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.artifact_name }}.zip .
          else
            zip -r ../${{ matrix.artifact_name }}.zip .
          fi
          cd ..
          ls -la ${{ matrix.artifact_name }}.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: egguf-system-*
          merge: false

      - name: Display structure
        run: find artifacts -type f -ls

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: egguf-system-${{ github.run_number }}
          name: EGGUF System Package v${{ github.run_number }}
          body: |
            ## EGGUF System — Full Multi-Platform Package

            ### Downloads
            - **Windows**: `egguf-system-windows.zip`
            - **macOS**: `egguf-system-macos.zip`
            - **Linux**: `egguf-system-linux.zip`

            ### What's Included
            - `gguf2egguf` — GGUF to EGGUF converter executable
            - `egguf` — Full EGGUF system (open, apply, scan, create EFE)
            - `publish_registry.py` — Publish file types to system registry
            - `sample_extensions/` — Sample EFE files

            ### Quick Start
            ```bash
            # Convert a model
            ./bin/gguf2egguf model.gguf

            # Open the EGGUF file
            ./bin/egguf open model.egguf

            # Publish file types to registry
            python publish_registry.py
            ```

            The converter adds the `#use:` system framework automatically.
          files: |
            artifacts/egguf-system-windows/egguf-system-windows.zip
            artifacts/egguf-system-macos/egguf-system-macos.zip
            artifacts/egguf-system-linux/egguf-system-linux.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
